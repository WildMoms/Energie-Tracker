<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Moms – Energie-Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Overpass:wght@300;400;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #F7F0E6;
    font-family: 'Noto Serif', serif;
    color: #3D2B1F;
  }
  .sans { font-family: 'Overpass', sans-serif; }
  .script { font-family: 'Dancing Script', cursive; }

  /* Header */
  .header { text-align: center; padding: 36px 20px 8px; }
  .leaf-deco { margin: 0 auto 4px; display: block; }
  .eyebrow {
    font-family: 'Overpass', sans-serif;
    font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
    color: #8A9E8C; font-weight: 300; margin: 10px 0 2px;
  }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 44px; color: #C4847A; font-weight: 600; line-height: 1.1;
    margin: 2px 0 0;
  }
  .date-line {
    font-family: 'Overpass', sans-serif;
    font-size: 13px; color: #B0A090; margin-top: 6px;
  }

  /* Nav */
  .nav {
    display: flex; justify-content: center;
    border-bottom: 1px solid #E5D9CC;
    margin: 24px 0 28px;
  }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    padding: 10px 28px;
    font-family: 'Overpass', sans-serif;
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    color: #B0A090; border-bottom: 2px solid transparent;
    font-weight: 400; transition: all 0.2s;
  }
  .nav-btn.active { color: #C4847A; border-bottom: 2px solid #C4847A; font-weight: 700; }

  /* Content */
  .content { max-width: 460px; margin: 0 auto; padding: 0 18px 60px; }
  .view { display: none; }
  .view.active { display: block; }

  /* Cards */
  .card {
    background: #FFFCF8; border-radius: 20px; padding: 26px 24px;
    margin-bottom: 16px; box-shadow: 0 2px 16px rgba(61,43,31,0.06);
  }
  .card-label {
    font-family: 'Noto Serif', serif;
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: #B0A090; font-weight: 400; margin-bottom: 4px;
  }
  .card-sub {
    font-family: 'Overpass', sans-serif;
    font-size: 13px; color: #B0A090; margin-bottom: 18px;
  }
  .level-name {
    font-family: 'Dancing Script', cursive;
    font-size: 28px; font-weight: 600; margin-bottom: 18px;
  }

  /* Level dots */
  .dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .dot {
    width: 50px; height: 50px; border-radius: 50%;
    background: #F0E8DE; border: 3px solid transparent;
    display: flex; align-items: center; justify-content: center;
    color: #C8B8A8; font-family: 'Overpass', sans-serif;
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all 0.25s;
  }
  .dot-labels {
    display: flex; justify-content: space-between;
    font-family: 'Overpass', sans-serif;
    font-size: 11px; color: #C0B0A0; padding: 0 6px;
  }

  /* Tags */
  .tags { display: flex; flex-wrap: wrap; gap: 9px; }
  .tag-btn {
    padding: 8px 16px; border-radius: 40px; border: none; cursor: pointer;
    background: #F0E6DC; color: #8A6A5A;
    font-family: 'Overpass', sans-serif; font-size: 13px;
    transition: all 0.2s; font-weight: 400;
  }
  .tag-btn.active { background: #C4847A; color: white; font-weight: 700; }
  .drain-btn {
    padding: 8px 16px; border-radius: 40px; border: none; cursor: pointer;
    background: #F0E6DC; color: #8A6A5A;
    font-family: 'Overpass', sans-serif; font-size: 13px;
    transition: all 0.2s; font-weight: 400;
  }
  .drain-btn.active { background: #9A7A8A; color: white; font-weight: 700; }

  /* Textarea */
  textarea {
    width: 100%; border: none; background: #F7F0E6; border-radius: 12px;
    padding: 13px 16px; font-family: 'Noto Serif', serif;
    font-size: 14px; color: #3D2B1F; line-height: 1.6; resize: none;
  }
  textarea:focus { outline: none; }

  /* Save btn */
  .save-btn {
    width: 100%; padding: 17px; border-radius: 50px; border: none;
    background: #C4847A; color: white;
    font-family: 'Overpass', sans-serif; font-size: 13px;
    font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
    cursor: pointer; transition: all 0.35s;
  }
  .save-btn.saved { background: #8A9E8C; }
  .saved-msg {
    text-align: center; margin-top: 14px;
    font-family: 'Dancing Script', cursive;
    font-size: 22px; color: #8A9E8C;
  }

  /* Today banner */
  .today-banner {
    text-align: center; margin-bottom: 18px;
    background: #EEF4EE; border-radius: 12px; padding: 10px 18px;
    font-family: 'Overpass', sans-serif; font-size: 12px;
    color: #6B8F6E; letter-spacing: 1px;
  }

  /* History */
  .summary-card {
    background: #F0E8DE; border-radius: 20px; padding: 20px 24px; margin-bottom: 24px;
  }
  .summary-avg {
    font-family: 'Dancing Script', cursive; font-size: 36px; color: #C4847A;
  }
  .summary-label {
    font-family: 'Overpass', sans-serif; font-size: 12px; color: #B0A090; margin-left: 6px;
  }
  .history-row {
    background: #FFFCF8; border-radius: 16px; padding: 18px 20px;
    margin-bottom: 12px; box-shadow: 0 2px 10px rgba(61,43,31,0.05);
    display: flex; align-items: center; gap: 16px;
  }
  .history-dot {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: 'Overpass', sans-serif; font-weight: 700; font-size: 18px;
  }
  .history-date { font-family: 'Overpass', sans-serif; font-size: 11px; color: #B0A090; margin-bottom: 2px; }
  .history-level { font-family: 'Dancing Script', cursive; font-size: 22px; line-height: 1; }
  .history-tags { font-family: 'Overpass', sans-serif; font-size: 11px; color: #A09080; margin-top: 4px; }
  .history-drains { font-family: 'Overpass', sans-serif; font-size: 11px; color: #9A7A8A; margin-top: 3px; }
  .history-note {
    font-family: 'Noto Serif', serif; font-size: 12px; color: #907060;
    margin-top: 4px; font-style: italic;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .empty { text-align: center; padding: 60px 20px; }
  .empty-title { font-family: 'Dancing Script', cursive; font-size: 30px; color: #C4847A; }
  .empty-sub { font-family: 'Overpass', sans-serif; font-size: 14px; color: #B0A090; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <svg class="leaf-deco" width="120" height="18" viewBox="0 0 120 18" fill="none">
    <path d="M10,9 Q20,2 30,9 Q20,16 10,9Z" fill="#8A9E8C" opacity="0.4"/>
    <path d="M30,9 Q40,2 50,9 Q40,16 30,9Z" fill="#8A9E8C" opacity="0.3"/>
    <line x1="50" y1="9" x2="70" y2="9" stroke="#C4847A" stroke-width="1" opacity="0.5"/>
    <path d="M70,9 Q80,2 90,9 Q80,16 70,9Z" fill="#8A9E8C" opacity="0.3"/>
    <path d="M90,9 Q100,2 110,9 Q100,16 90,9Z" fill="#8A9E8C" opacity="0.4"/>
  </svg>
  <p class="eyebrow">Wild Moms</p>
  <h1>Mein Energie-Tracker</h1>
  <p class="date-line" id="dateLine"></p>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="showView('checkin', this)">Check-in</button>
  <button class="nav-btn" onclick="showView('history', this)" id="historyNavBtn">Verlauf</button>
</div>

<div class="content">

  <!-- CHECK-IN -->
  <div class="view active" id="view-checkin">
    <div class="today-banner" id="todayBanner" style="display:none">
      ✓ Heute bereits eingetragen — du kannst es überschreiben
    </div>

    <!-- Level -->
    <div class="card">
      <p class="card-label">Wie voll ist dein Tank heute?</p>
      <p class="level-name" id="levelName">Mittel</p>
      <div class="dots" id="dots"></div>
      <div class="dot-labels"><span>leer</span><span>voll</span></div>
    </div>

    <!-- Kraftquellen -->
    <div class="card">
      <p class="card-label">Was hat dir Kraft gegeben?</p>
      <p class="card-sub">Alles was passt, auch mehreres.</p>
      <div class="tags" id="tags"></div>
    </div>

    <!-- Energie-Zieher -->
    <div class="card">
      <p class="card-label">Was hat Energie gezogen?</p>
      <p class="card-sub">Auch hier: alles was passt.</p>
      <div class="tags" id="drains"></div>
    </div>

    <!-- Notiz -->
    <div class="card">
      <p class="card-label">Notiz</p>
      <textarea id="noteInput" rows="3" placeholder="Was möchtest du dir merken? (optional)"></textarea>
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveEntry()">Eintragen</button>
    <p class="saved-msg" id="savedMsg" style="display:none">Gut, dass du dir Zeit nimmst. 🌿</p>
  </div>

  <!-- HISTORY -->
  <div class="view" id="view-history">
    <div id="historyContent"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'wild-moms-energie-tracker-v1';

const LEVELS = [
  { value: 1, label: 'Leer',   color: '#C4847A' },
  { value: 2, label: 'Wenig',  color: '#D4A078' },
  { value: 3, label: 'Mittel', color: '#C9A97A' },
  { value: 4, label: 'Gut',    color: '#8A9E8C' },
  { value: 5, label: 'Voll',   color: '#6B8F6E' },
];

const TAGS = [
  { id: 'natur',      label: 'Natur',       icon: '🌿' },
  { id: 'ruhe',       label: 'Ruhe',        icon: '🌙' },
  { id: 'bewegung',   label: 'Bewegung',    icon: '✨' },
  { id: 'verbindung', label: 'Verbindung',  icon: '🤝' },
  { id: 'allein',     label: 'Allein-Zeit', icon: '☕' },
  { id: 'kreativ',    label: 'Kreativität', icon: '🎨' },
  { id: 'wellness',   label: 'Wellness',    icon: '🛁' },
  { id: 'kraftort',   label: 'Kraftort',    icon: '🏔️' },
  { id: 'kind',       label: 'Kind',        icon: '🧡' },
];

const DRAINS = [
  { id: 'schlaf',      label: 'Schlafmangel',          icon: '😴' },
  { id: 'mental_load', label: 'Mental Load',            icon: '🌀' },
  { id: 'konflikt',    label: 'Konflikt',               icon: '⚡' },
  { id: 'ueberforderung', label: 'Überforderung',       icon: '🌊' },
  { id: 'einsamkeit',  label: 'Einsamkeit',             icon: '🪨' },
  { id: 'vergleich',   label: 'Vergleichen',            icon: '🔁' },
  { id: 'handy',       label: 'Zu viel Handy',          icon: '📱' },
  { id: 'keine_zeit',  label: 'Keine Zeit für mich',    icon: '⏳' },
  { id: 'zyklus',      label: 'Zyklus',                 icon: '🩸' },
];

let currentLevel = 3;
let selectedTags = [];
let selectedDrains = [];

// Date
const now = new Date();
document.getElementById('dateLine').textContent =
  now.toLocaleDateString('de-DE', { weekday:'long', day:'numeric', month:'long' });

// Load entries
function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// Build dots
function buildDots() {
  const container = document.getElementById('dots');
  container.innerHTML = '';
  LEVELS.forEach(l => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.textContent = l.value;
    d.onclick = () => setLevel(l.value);
    d.id = 'dot-' + l.value;
    container.appendChild(d);
  });
  updateDots();
}

function setLevel(val) {
  currentLevel = val;
  updateDots();
}

function updateDots() {
  const lvl = LEVELS.find(l => l.value === currentLevel);
  document.getElementById('levelName').textContent = lvl.label;
  document.getElementById('levelName').style.color = lvl.color;
  LEVELS.forEach(l => {
    const d = document.getElementById('dot-' + l.value);
    d.style.background = currentLevel >= l.value ? l.color : '#F0E8DE';
    d.style.borderColor = currentLevel === l.value ? l.color : 'transparent';
    d.style.color = currentLevel >= l.value ? 'white' : '#C8B8A8';
    d.style.boxShadow = currentLevel === l.value ? `0 4px 14px ${l.color}44` : 'none';
    d.style.transform = currentLevel === l.value ? 'scale(1.12)' : 'scale(1)';
  });
}

// Build tags
function buildButtons(items, containerId, selectedArr, cls, toggleFn) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = cls;
    btn.textContent = item.icon + ' ' + item.label;
    btn.id = cls + '-' + item.id;
    btn.onclick = () => toggleFn(item.id);
    container.appendChild(btn);
  });
}

function toggleTag(id) {
  if (selectedTags.includes(id)) selectedTags = selectedTags.filter(t => t !== id);
  else selectedTags.push(id);
  document.getElementById('tag-btn-' + id).classList.toggle('active');
}

function toggleDrain(id) {
  if (selectedDrains.includes(id)) selectedDrains = selectedDrains.filter(d => d !== id);
  else selectedDrains.push(id);
  document.getElementById('drain-btn-' + id).classList.toggle('active');
}

function buildTags() {
  const tc = document.getElementById('tags');
  tc.innerHTML = '';
  TAGS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn';
    btn.textContent = item.icon + ' ' + item.label;
    btn.id = 'tag-btn-' + item.id;
    btn.onclick = () => toggleTag(item.id);
    tc.appendChild(btn);
  });

  const dc = document.getElementById('drains');
  dc.innerHTML = '';
  DRAINS.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'drain-btn';
    btn.textContent = item.icon + ' ' + item.label;
    btn.id = 'drain-btn-' + item.id;
    btn.onclick = () => toggleDrain(item.id);
    dc.appendChild(btn);
  });
}

// Today check
function checkToday() {
  const todayStr = now.toISOString().split('T')[0];
  const entries = loadEntries();
  const todayEntry = entries.find(e => e.date === todayStr);
  document.getElementById('todayBanner').style.display = todayEntry ? 'block' : 'none';
}

// Save
function saveEntry() {
  const todayStr = now.toISOString().split('T')[0];
  const entry = {
    date: todayStr,
    level: currentLevel,
    tags: [...selectedTags],
    drains: [...selectedDrains],
    note: document.getElementById('noteInput').value,
    ts: Date.now()
  };
  const entries = loadEntries().filter(e => e.date !== todayStr);
  entries.unshift(entry);
  saveEntries(entries);

  const btn = document.getElementById('saveBtn');
  btn.textContent = '✓  Gespeichert';
  btn.classList.add('saved');
  document.getElementById('savedMsg').style.display = 'block';
  document.getElementById('todayBanner').style.display = 'block';
  updateHistoryNav();
  setTimeout(() => {
    btn.textContent = 'Eintragen';
    btn.classList.remove('saved');
    document.getElementById('savedMsg').style.display = 'none';
  }, 2500);
}

// History nav label
function updateHistoryNav() {
  const entries = loadEntries();
  const btn = document.getElementById('historyNavBtn');
  btn.textContent = entries.length > 0 ? `Verlauf (${entries.length})` : 'Verlauf';
}

// Show view
function showView(viewId, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  btn.classList.add('active');
  if (viewId === 'history') renderHistory();
}

// Render history
function renderHistory() {
  const entries = loadEntries();
  const todayStr = now.toISOString().split('T')[0];
  const container = document.getElementById('historyContent');

  if (entries.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <p class="empty-title">Noch nichts gespeichert</p>
        <p class="empty-sub">Mach deinen ersten Check-in!</p>
      </div>`;
    return;
  }

  let html = '';

  // Summary
  if (entries.length >= 3) {
    const recent = entries.slice(0, 7);
    const avg = (recent.reduce((s, e) => s + e.level, 0) / recent.length).toFixed(1);
    const tagCounts = {};
    recent.forEach(e => (e.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
    const topTag = Object.entries(tagCounts).sort((a, b) => b[1] - a[1])[0];
    const topTagObj = topTag ? TAGS.find(t => t.id === topTag[0]) : null;
    html += `<div class="summary-card">
      <p class="card-label">Letzte 7 Tage</p>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:8px">
        <div><span class="summary-avg">${avg}</span><span class="summary-label">Ø Energie</span></div>
        ${topTagObj ? `<div style="display:flex;align-items:center"><span style="font-size:20px">${topTagObj.icon}</span><span class="summary-label" style="margin-left:8px">${topTagObj.label} war deine häufigste Kraftquelle</span></div>` : ''}
      </div>
    </div>`;
  }

  // Entries
  entries.slice(0, 30).forEach(entry => {
    const lvl = LEVELS.find(l => l.value === entry.level);
    const d = new Date(entry.date);
    const isToday = entry.date === todayStr;
    const dateLabel = isToday ? 'Heute' : d.toLocaleDateString('de-DE', { weekday:'short', day:'numeric', month:'short' });
    const tagsHtml = (entry.tags || []).length > 0
      ? `<div class="history-tags">${entry.tags.map(t => TAGS.find(tg => tg.id === t)?.icon || '').join(' ')}&nbsp;&nbsp;<span style="color:#C0B0A0">${entry.tags.map(t => TAGS.find(tg => tg.id === t)?.label || '').join(', ')}</span></div>` : '';
    const drainsHtml = (entry.drains || []).length > 0
      ? `<div class="history-drains">${entry.drains.map(d => DRAINS.find(dr => dr.id === d)?.icon || '').join(' ')}&nbsp;&nbsp;<span style="color:#C0B0A0">${entry.drains.map(d => DRAINS.find(dr => dr.id === d)?.label || '').join(', ')}</span></div>` : '';
    const noteHtml = entry.note ? `<div class="history-note">„${entry.note}"</div>` : '';

    html += `<div class="history-row">
      <div class="history-dot" style="background:${lvl.color}">${entry.level}</div>
      <div style="flex:1;min-width:0">
        <div class="history-date">${dateLabel}</div>
        <div class="history-level" style="color:${lvl.color}">${lvl.label}</div>
        ${tagsHtml}${drainsHtml}${noteHtml}
      </div>
    </div>`;
  });

  container.innerHTML = html;
}

// Init
buildDots();
buildTags();
checkToday();
updateHistoryNav();
</script>
</body>
</html>
